{% extends 'base.html' %}

{% block title %}Select Movie{% endblock %}

{% block content %}
<div class="container">
    <h1 class="heading">Select Movie</h1>
  <p>
    {% for option in options %}
      <p><a href="{{ url_for('create', movie_id=option.id) }}"> {{ option.title }} - {{ option.release_date }}</a></p>
    {% endfor %}
  </p>

</div>
{% endblock %}
